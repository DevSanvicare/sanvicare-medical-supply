<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanvicare - Dashboard</title>

    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="./images/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./script.js"></script>
</head>

<body>
    <div id="container">
        <nav>
            <div class="logo-name">
                <div class="logo-image">
                    <img id="userAvatar" src="https://api.dicebear.com/9.x/adventurer/svg?flip=true&seed=Jocelyn"
                        alt="Profile">
                </div>
                <span class="logo_name" id="userNameDisplay"><span class="spinner"></span></span>
            </div>
            <div class="menu-items">
                <ul class="nav-links">
                    <li><a href="./" class="active">
                            <i class="uil uil-estate"></i>
                            <span class="link-name">Dashboard</span>
                        </a></li>
                    <li><a href="./products/">
                            <i class="uil uil-store"></i>
                            <span class="link-name">Products</span>
                        </a></li>
                    <li><a href="./notifications/">
                            <i class="uil uil-bell"></i>
                            <span class="link-name">Notifications</span>
                        </a></li>
                    <li><a href="./history/">
                            <i class="uil uil-history"></i>
                            <span class="link-name">History</span>
                        </a></li>
                    <li><a href="./admins/">
                            <i class="uil uil-users-alt"></i>
                            <span class="link-name">Admins</span>
                        </a></li>
                </ul>
                <ul class="logout-mode">
                    <li>
                        <div>
                            <i class="uil uil-signout" id="logoutIcon"></i>
                            <button class="link-name logout-button" id="logoutBtn">Logout</button>
                        </div>
                    </li>
                    <li class="mode">
                        <a>
                            <i class="uil uil-moon"></i>
                            <span class="link-name">Dark Mode</span>
                        </a>
                        <div class="mode-toggle">
                            <span class="switch"></span>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
        <section class="dashboard">
            <div class="top">
                <i class="uil uil-bars sidebar-toggle"></i>
            </div>
            <div class="dash-content">                
                <div class="activity">
                    <div class="title">
                        <div class="title-header">
                            <i class="uil uil-store"></i>
                            <span class="text">Inventory Management</span>
                        </div>

                        <!-- Search Bar -->
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="Search by Name">
                            <button id="searchBtn">
                                <i class="uil uil-search"></i>
                            </button>
                        </div>
                    </div>
                    <hr>
                    <div class="table-container">
                        <table class="activity-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Brand</th>
                                    <th>Location</th>
                                    <th>Unit Cost</th>
                                    <th>Selling Price</th>
                                    <th>Stocks Left</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr>
                                    <td colspan="7" style="text-align: center;">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- STOCK MODAL -->
    <div id="stockModal" class="modal" style="visibility: hidden;">
        <div class="modal-content">

            <!-- CLOSE BUTTON -->
            <button class="close-button" id="stockModalClose" aria-label="Close">
                <i class="uil uil-times"></i>
            </button>

            <!-- TITLE -->
            <h2 class="modal-title" id="stockModalTitle">
                Update Stock
            </h2>

            <!-- FORM -->
            <form id="stockForm">

                <!-- hidden values -->
                <input type="hidden" id="stockProductId" />
                <input type="hidden" id="stockAction" />

                <!-- PRODUCT NAME -->
                <div class="form-group">
                    <label for="stockProductName">Product</label>
                    <input type="text" id="stockProductName" readonly />
                </div>

                <!-- CURRENT STOCK -->
                <div class="form-group">
                    <label for="currentStock">Current Stock</label>
                    <input type="number" id="currentStock" readonly />
                </div>

                <!-- QUANTITY -->
                <div class="form-group">
                    <label for="stockQuantity">Quantity</label>
                    <input type="number" id="stockQuantity" min="1" placeholder="Enter quantity" required />
                </div>

                <!-- REASON -->
                <div class="form-group">
                    <label for="stockReason">Reason (Optional)</label>
                    <textarea id="stockReason" rows="3"
                        placeholder="Example: New delivery / Sold items / Damaged item"></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="submit-button" id="stockSubmitBtn">
                    Confirm
                </button>

            </form>

        </div>
    </div>

</body>

</html>
