<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanvicare - Products</title>

    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="./images/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./script.js"></script>
</head>

<body>
    <div id="container">
        <nav>
            <div class="logo-name">
                <div class="logo-image">
                    <img id="userAvatar" src="https://api.dicebear.com/9.x/adventurer/svg?flip=true&seed=Jocelyn"
                        alt="Profile">
                </div>
                <span class="logo_name" id="userNameDisplay"><span class="spinner"></span></span>
            </div>
            <div class="menu-items">
                <ul class="nav-links">
                    <li><a href="../index.html">
                            <i class="uil uil-estate"></i>
                            <span class="link-name">Dashboard</span>
                        </a></li>
                    <li><a href="../products/" class="active">
                            <i class="uil uil-store"></i>
                            <span class="link-name">Products</span>
                        </a></li>
                    <li><a href="../notifications/">
                            <i class="uil uil-bell"></i>
                            <span class="link-name">Notifications</span>
                        </a></li>
                    <li><a href="../history/">
                            <i class="uil uil-history"></i>
                            <span class="link-name">History</span>
                        </a></li>
                    <li><a href="../admins/">
                            <i class="uil uil-users-alt"></i>
                            <span class="link-name">Admins</span>
                        </a></li>
                </ul>
                <ul class="logout-mode">
                    <li>
                        <div>
                            <i class="uil uil-signout" id="logoutIcon"></i>
                            <button class="link-name logout-button" id="logoutBtn">Logout</button>
                        </div>
                    </li>
                    <li class="mode">
                        <a>
                            <i class="uil uil-moon"></i>
                            <span class="link-name">Dark Mode</span>
                        </a>
                        <div class="mode-toggle">
                            <span class="switch"></span>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
        <section class="dashboard">
            <div class="top">
                <i class="uil uil-bars sidebar-toggle"></i>
            </div>
            <div class="dash-content">
                <div class="activity">
                    <div class="title">
                        <div class="title-header">
                            <i class="uil uil-location-point icon-title"></i>
                            <span class="text">Products Management</span>
                        </div>

                        <div class="title-actions">
                            <!-- Search Bar -->
                            <div class="search-box">
                                <input type="text" id="searchInput" placeholder="Search by Name">
                                <button id="searchBtn">
                                    <i class="uil uil-search"></i>
                                </button>
                            </div>

                            <button class="add-btn" id="addProductBtn">
                                <i class="uil uil-plus"></i>
                            </button>
                        </div>
                    </div>
                    <hr>
                    <div class="table-container">
                        <table class="activity-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Brand</th>
                                    <th>Location</th>
                                    <th>Unit Cost</th>
                                    <th>Selling Price</th>
                                    <th>Stocks Left</th>
                                    <th>Created At</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr>
                                    <td colspan="8" style="text-align: center;">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Edit Product Modal -->
    <div id="editModal" class="modal" style="visibility: hidden;">
        <div class="modal-content">

            <button class="close-button" id="editModalClose" aria-label="Close">
                <i class="uil uil-times"></i>
            </button>

            <h2 class="modal-title">Edit Product</h2>

            <form id="editProductForm" class="editProductForm">

                <input type="hidden" id="editProductId" />

                <div class="form-group">
                    <label for="editProductName">Product Name</label>
                    <input type="text" id="editProductName" required />
                </div>

                <div class="form-group">
                    <label for="editBrand">Brand</label>
                    <input type="text" id="editBrand" />
                </div>

                <div class="form-group">
                    <label for="editLocation">Location</label>
                    <input type="text" id="editLocation" />
                </div>

                <div class="form-group">
                    <label for="editUnitCost">Unit Cost</label>
                    <input type="number" id="editUnitCost" required />
                </div>

                <div class="form-group">
                    <label for="editSellingPrice">Selling Price</label>
                    <input type="number" id="editSellingPrice" required />
                </div>

                <div class="form-group">
                    <label for="editStocksLeft">Stocks Left</label>
                    <input type="number" id="editStocksLeft" required />
                </div>

                <button type="submit" class="submit-button">Save Changes</button>

            </form>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="addModal" class="modal" style="visibility: hidden;">
        <div class="modal-content">

            <button class="close-button" id="addModalClose" aria-label="Close">
                <i class="uil uil-times"></i>
            </button>

            <h2 class="modal-title">Add Product</h2>

            <form id="addProductForm" class="editProductForm">

                <div class="form-group">
                    <label for="addProductName">Product Name</label>
                    <input type="text" id="addProductName" required />
                </div>

                <div class="form-group">
                    <label for="addBrand">Brand</label>
                    <input type="text" id="addBrand" />
                </div>

                <div class="form-group">
                    <label for="addLocation">Location</label>
                    <input type="text" id="addLocation" />
                </div>

                <div class="form-group">
                    <label for="addUnitCost">Unit Cost</label>
                    <input type="number" id="addUnitCost" required />
                </div>

                <div class="form-group">
                    <label for="addSellingPrice">Selling Price</label>
                    <input type="number" id="addSellingPrice" required />
                </div>

                <div class="form-group">
                    <label for="addStocksLeft">Initial Stocks</label>
                    <input type="number" id="addStocksLeft" value="0" required />
                </div>

                <button type="submit" class="submit-button">Add Product</button>

            </form>

        </div>
    </div>

</body>

</html>
